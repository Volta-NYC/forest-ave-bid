<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Nina photo placeholder</title>
  <desc id="desc">Placeholder panel for staff photos supplied by Nina.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7efe5"/>
      <stop offset="1" stop-color="#efe0cc"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect x="44" y="44" width="552" height="392" rx="26" fill="none" stroke="#b7a38b" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="320" cy="186" r="64" fill="#dcc8ad"/>
  <rect x="210" y="272" width="220" height="96" rx="48" fill="#d2b793"/>
  <text x="320" y="410" text-anchor="middle" fill="#5a5248" font-family="Arial, sans-serif" font-size="22" font-weight="700">Nina Photo Placeholder</text>
