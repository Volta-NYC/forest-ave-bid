<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">City Official logo tile</title>
  <desc id="desc">City of New York official placeholder logo for elected officials.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f2e4f"/>
      <stop offset="1" stop-color="#164a7d"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="36" fill="url(#bg)"/>
  <circle cx="320" cy="180" r="72" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="10"/>
  <text x="320" y="196" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="34" font-weight="700">NYC</text>
  <text x="320" y="305" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Official Partner</text>
  <text x="320" y="340" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="Arial, sans-serif" font-size="18">Forest Avenue BID</text>
</svg>
